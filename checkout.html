<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – SB CLASSIC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fff;
      color: #333;
    }

    h1 { text-align: center; }

    form {
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    #order-summary {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border: 1px solid #ddd;
    }

    #total-display {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: #191970;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Checkout 💳</h1>

  <form id="checkout-form">
    <label for="fullname">Full Name</label>
    <input
      id="fullname"
      type="text"
      placeholder="Enter your full name"
      required
    >

    <label for="phone">Phone Number</label>
    <input
      id="phone"
      type="tel"
      placeholder="Enter your phone number"
      required
    >

    <label for="delivery">Delivery Location</label>
    <input
      id="delivery"
      type="text"
      placeholder="Enter your delivery address and country"
      required
    >

    <div id="order-summary">
      <strong>Order Summary</strong>
      <div id="cart-details"></div>
      <div id="total-display">Total: ₦0</div>
    </div>

    <button class="btn" type="submit">
      Continue to Nigerian Paystack
    </button>

    <a class="back" href="cart.html">← Return to Cart</a>
  </form>

  <script>
    const PAYSTACK_PAYMENT_PAGE =
      "https://paystack.shop/pay/sbclassic";

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function formatNaira(amount) {
      return "₦" + Number(amount).toLocaleString("en-NG", {
        maximumFractionDigits: 0
      });
    }

    function displayOrder() {
      const cart = getCart();
      const details = document.getElementById("cart-details");
      const totalDisplay = document.getElementById("total-display");

      details.innerHTML = "";

      if (cart.length === 0) {
        details.textContent = "Your cart is empty.";
        totalDisplay.textContent = "Total: ₦0";
        return;
      }

      let total = 0;

      cart.forEach(item => {
        const price = Number(item.price || 0);
        const quantity = Number(item.quantity || 1);
        const itemTotal = price * quantity;

        total += itemTotal;

        const line = document.createElement("p");
        line.textContent =
          (item.name || "Product") +
          " × " + quantity +
          " — " + formatNaira(itemTotal);

        details.appendChild(line);
      });

      totalDisplay.textContent = "Total: " + formatNaira(total);
      localStorage.setItem("cartTotal", String(total));
    }

    document.getElementById("checkout-form").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        const cart = getCart();

        if (cart.length === 0) {
          alert("Your cart is empty. Please add a product first.");
          return;
        }

        const total = Number(localStorage.getItem("cartTotal") || 0);

        if (!Number.isFinite(total) || total <= 0) {
          alert("The order total is invalid. Please check your cart.");
          return;
        }

        const customer = {
          name: document.getElementById("fullname").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          delivery: document.getElementById("delivery").value.trim(),
          totalNGN: total,
          reference: "SB-" + Date.now()
        };

        localStorage.setItem(
          "sbclassicPendingOrder",
          JSON.stringify(customer)
        );

        alert(
          "Your order total is " + formatNaira(total) +
          ". On Paystack, enter this exact amount in naira. " +
          "Your order details are saved in this browser."
        );

        window.location.href = PAYSTACK_PAYMENT_PAGE;
      }
    );

    displayOrder();
  </script>
</body>
</html>
