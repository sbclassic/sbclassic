<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – SB CLASSIC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fff;
      color: #333;
    }

    h1 {
      text-align: center;
    }

    form {
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
    }

    #order-summary {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    #cart-details p {
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
      line-height: 1.5;
    }

    #total-display {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
    }

    #converted-total {
      margin-top: 8px;
      text-align: center;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .currency-note {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: #191970;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
    }

    #checkout-message {
      margin-top: 15px;
      padding: 10px;
      line-height: 1.5;
      border-radius: 4px;
    }

    #checkout-message:empty {
      display: none;
    }

    #checkout-message.error {
      color: #a00000;
      background: #fff0f0;
    }

    #checkout-message.info {
      color: #194619;
      background: #eff8ef;
    }
  </style>
</head>

<body>
  <h1>Checkout 💳</h1>

  <form id="checkout-form">
    <label for="fullname">Full Name</label>
    <input
      id="fullname"
      name="fullname"
      type="text"
      placeholder="Enter your full name"
      autocomplete="name"
      required
    >

    <label for="phone">Phone Number</label>
    <input
      id="phone"
      name="phone"
      type="tel"
      placeholder="Enter your phone number"
      autocomplete="tel"
      required
    >

    <label for="delivery">Delivery Location</label>
    <input
      id="delivery"
      name="delivery"
      type="text"
      placeholder="Enter your delivery address and country"
      autocomplete="street-address"
      required
    >

    <label for="display-currency">Display Currency</label>
    <select id="display-currency" name="display-currency">
      <option value="NGN">Nigerian Naira (NGN ₦)</option>
      <option value="GHS">Ghanaian Cedi (GHS GH₵)</option>
      <option value="USD">US Dollar (USD $)</option>
      <option value="XOF">West African CFA Franc (XOF CFA)</option>
    </select>

    <p class="currency-note">
      Choose the currency you want to view. Other-currency amounts
      are estimates. Payment through this Nigerian Paystack page
      remains in naira.
    </p>

    <div id="order-summary">
      <strong>Order Summary</strong>
      <div id="cart-details"></div>
      <div id="total-display">Total: ₦0</div>
      <div id="converted-total"></div>
    </div>

    <div id="checkout-message" role="status" aria-live="polite"></div>

    <button class="btn" id="pay-button" type="submit">
      Continue to Nigerian Paystack
    </button>

    <a class="back" href="cart.html">← Return to Cart</a>
  </form>

  <script>
    const PAYSTACK_PAYMENT_PAGE =
      "https://paystack.shop/pay/sbclassic";

    /*
      Indicative display rates only.
      Update these when necessary.
      All actual order totals remain in NGN.
    */
    const NGN_PER_UNIT = {
      NGN: 1,
      GHS: 114.15,
      USD: 1330,
      XOF: 2.26
    };

    const CURRENCY_INFO = {
      NGN: {
        symbol: "₦",
        locale: "en-NG",
        decimals: 0
      },
      GHS: {
        symbol: "GH₵",
        locale: "en-GH",
        decimals: 2
      },
      USD: {
        symbol: "$",
        locale: "en-US",
        decimals: 2
      },
      XOF: {
        symbol: "CFA ",
        locale: "fr-SN",
        decimals: 0
      }
    };

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        return Array.isArray(cart) ? cart : [];
      } catch (error) {
        return [];
      }
    }

    function formatMoney(amount, currency) {
      const info = CURRENCY_INFO[currency] || CURRENCY_INFO.NGN;

      return info.symbol + Number(amount).toLocaleString(info.locale, {
        minimumFractionDigits: info.decimals,
        maximumFractionDigits: info.decimals
      });
    }

    function convertFromNaira(amount, currency) {
      return Number(amount) / (NGN_PER_UNIT[currency] || 1);
    }

    function getSelectedCurrency() {
      return document.getElementById("display-currency").value;
    }

    function calculateOrder() {
      const cart = getCart();

      let totalNGN = 0;
      let valid = cart.length > 0;

      const items = cart.map(item => {
        const price = Number(item.price);
        const quantity = Number(item.quantity || 1);

        if (
          !Number.isFinite(price) ||
          price <= 0 ||
          !Number.isFinite(quantity) ||
          quantity <= 0
        ) {
          valid = false;
          return null;
        }

        const itemTotal = price * quantity;
        totalNGN += itemTotal;

        return {
          name: item.name || "Product",
          quantity: quantity,
          priceNGN: price,
          itemTotalNGN: itemTotal
        };
      });

      return {
        items: items,
        totalNGN: totalNGN,
        valid: valid && Number.isFinite(totalNGN) && totalNGN > 0
      };
    }

    function showMessage(text, type) {
      const message = document.getElementById("checkout-message");

      message.textContent = text;
      message.className = type || "";
    }

    function displayOrder() {
      const order = calculateOrder();
      const details = document.getElementById("cart-details");
      const totalDisplay = document.getElementById("total-display");
      const convertedTotal = document.getElementById("converted-total");
      const payButton = document.getElementById("pay-button");
      const currency = getSelectedCurrency();

      details.innerHTML = "";
      convertedTotal.textContent = "";

      if (getCart().length === 0) {
        details.textContent = "Your cart is empty. Return to the cart to add products.";
        totalDisplay.textContent = "Total: ₦0";
        payButton.disabled = true;
        localStorage.setItem("cartTotal", "0");
        return;
      }

      if (!order.valid) {
        details.textContent =
          "One or more products have an invalid price or quantity. Please review your cart.";
        totalDisplay.textContent = "Unable to calculate total";
        payButton.disabled = true;
        return;
      }

      payButton.disabled = false;

      order.items.forEach(item => {
        const line = document.createElement("p");

        line.textContent =
          item.name +
          " × " + item.quantity +
          " — " + formatMoney(
            convertFromNaira(item.itemTotalNGN, currency),
            currency
          );

        details.appendChild(line);
      });

      totalDisplay.textContent =
        "Total: " +
        formatMoney(
          convertFromNaira(order.totalNGN, currency),
          currency
        );

      if (currency !== "NGN") {
        convertedTotal.textContent =
          "Naira payment amount: " +
          formatMoney(order.totalNGN, "NGN") +
          ". Your Paystack payment must be made in NGN.";
      }

      // Keep the actual amount in naira for the payment process.
      localStorage.setItem("cartTotal", String(order.totalNGN));
    }

    document
      .getElementById("display-currency")
      .addEventListener("change", function () {
        localStorage.setItem("sbclassicDisplayCurrency", this.value);
        displayOrder();
      });

    document.getElementById("checkout-form").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        const order = calculateOrder();

        if (!order.valid) {
          showMessage(
            "Your cart is empty or contains an invalid item. Please return to your cart and check your order.",
            "error"
          );
          return;
        }

        const customer = {
          name: document.getElementById("fullname").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          delivery: document.getElementById("delivery").value.trim(),
          totalNGN: order.totalNGN,
          currency: "NGN",
          displayCurrency: getSelectedCurrency(),
          items: order.items,
          reference: "SB-" + Date.now(),
          createdAt: new Date().toISOString()
        };

        if (!customer.name || !customer.phone || !customer.delivery) {
          showMessage(
            "Please complete your name, phone number, and delivery location.",
            "error"
          );
          return;
        }

        localStorage.setItem(
          "sbclassicPendingOrder",
          JSON.stringify(customer)
        );

        /*
          This saves the order details in this browser.
          The hosted Paystack link does not automatically receive
          these details or set the amount for the customer.
        */
        showMessage(
          "Your order total is " + formatMoney(order.totalNGN, "NGN") +
          ". On Paystack, enter this exact amount in naira. " +
          "Your order details have been saved in this browser.",
          "info"
        );

        // Brief pause allows the customer to read the inline notice.
        setTimeout(function () {
          window.location.href = PAYSTACK_PAYMENT_PAGE;
        }, 1200);
      }
    );

    document.addEventListener("DOMContentLoaded", function () {
      const savedCurrency =
        localStorage.getItem("sbclassicDisplayCurrency");

      if (savedCurrency && CURRENCY_INFO[savedCurrency]) {
        document.getElementById("display-currency").value = savedCurrency;
      }

      displayOrder();
    });
  </script>
</body>
  </html>
