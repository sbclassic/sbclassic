
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – SB CLASSIC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fff;
      color: #333;
    }

    h1 { text-align: center; }

    form {
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
    }

    #order-summary {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    #cart-details p {
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #total-display {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
    }

    #converted-total {
      margin-top: 8px;
      text-align: center;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .currency-note {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: #191970;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
    }

    #checkout-message {
      margin-top: 15px;
      padding: 10px;
      line-height: 1.5;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }

    #checkout-message:empty { display: none; }

    #checkout-message.error {
      color: #a00000;
      background: #fff0f0;
    }

    #checkout-message.info {
      color: #194619;
      background: #eff8ef;
    }
  </style>
</head>

<body>
  <h1>Checkout 💳</h1>

  <form id="checkout-form">
    <label for="fullname">Full Name</label>
    <input
      id="fullname"
      name="fullname"
      type="text"
      placeholder="Enter your full name"
      autocomplete="name"
      required
    >

    <label for="email">Email Address</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="Enter your email address"
      autocomplete="email"
      required
    >

    <label for="phone">Phone Number</label>
    <input
      id="phone"
      name="phone"
      type="tel"
      placeholder="Enter your phone number"
      autocomplete="tel"
      required
    >

    <label for="delivery">Delivery Location</label>
    <input
      id="delivery"
      name="delivery"
      type="text"
      placeholder="Enter your delivery address and country"
      autocomplete="street-address"
      required
    >

    <label for="display-currency">Display Currency</label>
    <select id="display-currency" name="display-currency">
      <option value="NGN">Nigerian Naira (NGN ₦)</option>
      <option value="GHS">Ghanaian Cedi (GHS GH₵)</option>
      <option value="USD">US Dollar (USD $)</option>
      <option value="XOF">West African CFA Franc (XOF CFA)</option>
    </select>

    <p class="currency-note">
      Choose the currency you want to view. Other-currency amounts
      are estimates. Payment through this Nigerian Paystack page
      remains in naira.
    </p>

    <div id="order-summary">
      <strong>Order Summary</strong>
      <div id="cart-details"></div>
      <div id="total-display">Total: ₦0</div>
      <div id="converted-total"></div>
    </div>

    <div id="checkout-message" role="status" aria-live="polite"></div>

    <button class="btn" id="pay-button" type="submit">
      Continue to Paystack
    </button>

    <a class="back" href="cart.html">← Return to Cart</a>
  </form>

  <script>
    "use strict";

    const PAYMENT_WORKER =
      "https://sbclassic-payments.benjoye21.workers.dev";

    // Display estimates only. Paystack charges in NGN.
    const NGN_PER_UNIT = {
      NGN: 1,
      GHS: 114.15,
      USD: 1330,
      XOF: 2.26
    };

    const CURRENCY_INFO = {
      NGN: { symbol: "₦", locale: "en-NG", decimals: 0 },
      GHS: { symbol: "GH₵", locale: "en-GH", decimals: 2 },
      USD: { symbol: "$", locale: "en-US", decimals: 2 },
      XOF: { symbol: "CFA ", locale: "fr-SN", decimals: 0 }
    };

    const form = document.getElementById("checkout-form");
    const payButton = document.getElementById("pay-button");
    const currencySelect = document.getElementById("display-currency");

    let verifyingPayment =
      new URLSearchParams(window.location.search).get("payment") === "return";

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        return Array.isArray(cart) ? cart : [];
      } catch (error) {
        return [];
      }
    }

    function money(amount, currency = "NGN") {
      const info = CURRENCY_INFO[currency] || CURRENCY_INFO.NGN;
      const value = Number(amount);

      if (!Number.isFinite(value)) {
        return info.symbol + "0";
      }

      return info.symbol + value.toLocaleString(info.locale, {
        minimumFractionDigits: info.decimals,
        maximumFractionDigits: info.decimals
      });
    }

    function calculateOrder() {
      const cart = getCart();
      let totalNGN = 0;
      let valid = cart.length > 0;

      const items = cart.map(item => {
        if (!item || typeof item.name !== "string" || !item.name.trim()) {
          valid = false;
          return null;
        }

        const priceNGN = Number(item.price);
        const quantity = Number(item.quantity || 1);

        if (
          !Number.isSafeInteger(priceNGN) ||
          priceNGN <= 0 ||
          !Number.isInteger(quantity) ||
          quantity < 1 ||
          quantity > 20
        ) {
          valid = false;
          return null;
        }

        const itemTotal = priceNGN * quantity;

        if (!Number.isSafeInteger(itemTotal)) {
          valid = false;
          return null;
        }

        totalNGN += itemTotal;

        return {
          name: item.name.trim(),
          priceNGN,
          quantity,
          size: item.size == null ? "" : String(item.size),
          color: item.color == null ? "" : String(item.color)
        };
      });

      return {
        items,
        totalNGN,
        valid:
          valid &&
          items.every(Boolean) &&
          Number.isSafeInteger(totalNGN) &&
          totalNGN > 0
      };
    }

    function showMessage(message, type = "") {
      const element = document.getElementById("checkout-message");
      element.textContent = message;
      element.className = type;
    }

    function displayOrder() {
      const order = calculateOrder();
      const details = document.getElementById("cart-details");
      const totalDisplay = document.getElementById("total-display");
      const convertedTotal = document.getElementById("converted-total");
      const currency = currencySelect.value;

      details.replaceChildren();
      convertedTotal.textContent = "";

      if (getCart().length === 0) {
        details.textContent =
          "Your cart is empty. Return to the cart to add products.";
        totalDisplay.textContent = "Total: ₦0";
        localStorage.setItem("cartTotal", "0");

        if (!verifyingPayment) payButton.disabled = true;
        return;
      }

      if (!order.valid) {
        details.textContent =
          "An item has an invalid price or quantity. Please review your cart.";
        totalDisplay.textContent = "Unable to calculate total";
        payButton.disabled = true;
        return;
      }

      if (!verifyingPayment) payButton.disabled = false;

      order.items.forEach(item => {
        const line = document.createElement("p");
        const displayedAmount =
          item.priceNGN * item.quantity / NGN_PER_UNIT[currency];

        line.textContent =
          item.name + " × " + item.quantity + " — " +
          money(displayedAmount, currency);

        details.appendChild(line);
      });

      totalDisplay.textContent =
        "Total: " + money(order.totalNGN / NGN_PER_UNIT[currency], currency);

      if (currency !== "NGN") {
        convertedTotal.textContent =
          "Naira payment amount: " + money(order.totalNGN) +
          ". Your Paystack payment remains in Nigerian naira.";
      }

      localStorage.setItem("cartTotal", String(order.totalNGN));
    }

    currencySelect.addEventListener("change", function () {
      localStorage.setItem("sbclassicDisplayCurrency", this.value);
      displayOrder();
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (verifyingPayment) {
        showMessage(
          "Payment verification is in progress. Please refresh this page to retry verification. Do not pay again yet.",
          "error"
        );
        return;
      }

      const order = calculateOrder();

      if (!order.valid) {
        showMessage(
          "Your cart is empty or contains an invalid item. Please review your cart.",
          "error"
        );
        return;
      }

      const customer = {
        name: document.getElementById("fullname").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        delivery: document.getElementById("delivery").value.trim()
      };

      if (
        !customer.name ||
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customer.email) ||
        !customer.phone ||
        !customer.delivery
      ) {
        showMessage(
          "Enter your full name, valid email address, phone number and delivery address.",
          "error"
        );
        return;
      }

      payButton.disabled = true;
      payButton.textContent = "Preparing payment…";
      showMessage("Checking your order and preparing secure payment…", "info");

      try {
        const response = await fetch(PAYMENT_WORKER + "/initialize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer,
            items: order.items
          })
        });

        const result = await response.json();

        if (
          !response.ok ||
          !result.authorizationUrl ||
          !result.reference ||
          !Number.isSafeInteger(Number(result.amountNGN)) ||
          Number(result.amountNGN) <= 0
        ) {
          throw new Error(
            result.error || "Unable to prepare your Paystack payment."
          );
        }

        const pendingOrder = {
          ...customer,
          items: order.items,
          totalNGN: Number(result.amountNGN),
          reference: String(result.reference),
          createdAt: new Date().toISOString()
        };

        localStorage.setItem(
          "sbclassicPendingOrder",
          JSON.stringify(pendingOrder)
        );

        window.location.href = result.authorizationUrl;

      } catch (error) {
        showMessage(
          error.message || "Payment could not be started. Please try again.",
          "error"
        );

        payButton.disabled = false;
        payButton.textContent = "Continue to Nigerian Paystack";
      }
    });

    async function verifyReturnedPayment() {
      if (!verifyingPayment) return;

      payButton.disabled = true;
      payButton.textContent = "Verifying payment…";

      const params = new URLSearchParams(window.location.search);
      const reference = params.get("reference") || params.get("trxref");

      if (!reference) {
        showMessage(
          "No payment reference was returned. Please contact SB CLASSIC before paying again.",
          "error"
        );
        return;
      }

      let pendingOrder;

      try {
        pendingOrder = JSON.parse(
          localStorage.getItem("sbclassicPendingOrder") || "null"
        );
      } catch (error) {
        pendingOrder = null;
      }

      if (!pendingOrder || pendingOrder.reference !== reference) {
        showMessage(
          "This payment does not match the pending order saved in this browser. Please contact SB CLASSIC before paying again.",
          "error"
        );
        return;
      }

      showMessage("Verifying your payment directly with Paystack…", "info");

      try {
        const response = await fetch(
          PAYMENT_WORKER + "/verify?reference=" +
          encodeURIComponent(reference)
        );

        const result = await response.json();

        if (
          !response.ok ||
          result.verified !== true ||
          result.currency !== "NGN" ||
          result.reference !== pendingOrder.reference ||
          Number(result.amountNGN) !== Number(pendingOrder.totalNGN)
        ) {
          showMessage(
            "Paystack has not confirmed the expected payment amount. Do not pay again yet. Refresh this page to retry verification, or contact SB CLASSIC.",
            "error"
          );
          return;
        }

        pendingOrder.paymentStatus = "success";
        pendingOrder.verifiedAmountNGN = Number(result.amountNGN);
        pendingOrder.verifiedAt = new Date().toISOString();

        localStorage.setItem(
          "sbclassicLastPaidOrder",
          JSON.stringify(pendingOrder)
        );

        localStorage.removeItem("sbclassicPendingOrder");
        localStorage.removeItem("cart");
        localStorage.setItem("cartTotal", "0");

        document.getElementById("cart-details").textContent =
          "Your payment has been verified successfully.";

        document.getElementById("total-display").textContent =
          "Paid: " + money(result.amountNGN);

        document.getElementById("converted-total").textContent =
          "Payment reference: " + result.reference;

        showMessage(
          "Payment successful and verified. Thank you for shopping with SB CLASSIC!",
          "info"
        );

        payButton.textContent = "Payment Confirmed";
        payButton.disabled = true;

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        verifyingPayment = false;

      } catch (error) {
        showMessage(
          "We could not verify payment just now. Check your connection and refresh this page to retry. Do not pay again yet.",
          "error"
        );
      }
    }

    function initializeCheckout() {
      const savedCurrency =
        localStorage.getItem("sbclassicDisplayCurrency");

      if (savedCurrency && CURRENCY_INFO[savedCurrency]) {
        currencySelect.value = savedCurrency;
      }

      displayOrder();

      if (verifyingPayment) {
        payButton.disabled = true;
        verifyReturnedPayment();
      }
    }

    initializeCheckout();
  </script>
</body>
  </html>
