<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart – SB CLASSIC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fff;
      color: #333;
    }

    h1 { margin-bottom: 20px; }

    .cart-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      padding: 10px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .cart-item img {
      width: 100px;
      height: auto;
      object-fit: contain;
    }

    .cart-item h3 {
      margin: 0;
      font-size: 16px;
    }

    .cart-item p { margin: 6px 0; }

    button {
      margin: 5px 5px 5px 0;
      padding: 8px 12px;
      cursor: pointer;
    }

    #cart-total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #checkout-link {
      display: none;
      margin-top: 20px;
      padding: 12px 20px;
      background: #191970;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      display: inline-block;
    }

    #clear-cart-btn {
      margin-top: 15px;
      padding: 10px 16px;
      background: #888;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <h1>Your Cart 🛒</h1>

  <div id="cart-items"></div>

  <div id="cart-total"></div>

  <button id="clear-cart-btn" onclick="clearCart()">
    🧹 Clear Cart
  </button>

  <br>

  <a href="checkout.html" id="checkout-link">
    Proceed to Checkout 💳
  </a>

  <script>
    const NAIRA_PRICING_VERSION = "sbclassic-naira-v1";

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    /*
      Your pricing rule:
      NGN price = (old GHS price - 100) × 100

      Existing cart prices are converted once.
      The marker prevents converting them again.
    */
    function convertCartPricesOnce() {
      const convertedVersion =
        localStorage.getItem("sbclassicPricingVersion");

      if (convertedVersion === NAIRA_PRICING_VERSION) {
        return;
      }

      const cart = getCart();

      cart.forEach(item => {
        const oldPrice = Number(item.price);

        if (Number.isFinite(oldPrice) && oldPrice > 100) {
          item.price = Math.round((oldPrice - 100) * 100);
          item.priceCurrency = "NGN";
        }
      });

      saveCart(cart);
      localStorage.setItem(
        "sbclassicPricingVersion",
        NAIRA_PRICING_VERSION
      );
    }

    function formatNaira(amount) {
      return "₦" + Number(amount).toLocaleString("en-NG", {
        maximumFractionDigits: 0
      });
    }

    function removeItem(productId) {
      const cart = getCart().filter(
        item => String(item.id) !== String(productId)
      );

      saveCart(cart);
      renderCart();
    }

    function updateQuantity(productId, change) {
      const cart = getCart();
      const item = cart.find(
        i => String(i.id) === String(productId)
      );

      if (item) {
        item.quantity = Number(item.quantity || 1) + change;

        if (item.quantity <= 0) {
          removeItem(productId);
          return;
        }
      }

      saveCart(cart);
      renderCart();
    }

    function clearCart() {
      localStorage.removeItem("cart");
      localStorage.removeItem("cartTotal");
      localStorage.removeItem("sbclassicPricingVersion");
      renderCart();
    }

    function renderCart() {
      const cartItemsDiv = document.getElementById("cart-items");
      const cartTotalDiv = document.getElementById("cart-total");
      const checkoutLink = document.getElementById("checkout-link");

      const cart = getCart();
      cartItemsDiv.innerHTML = "";

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
        cartTotalDiv.textContent = "";
        checkoutLink.style.display = "none";
        localStorage.setItem("cartTotal", "0");
        return;
      }

      let total = 0;

      cart.forEach(item => {
        const quantity = Number(item.quantity || 1);
        const price = Number(item.price || 0);
        const itemTotal = price * quantity;

        total += itemTotal;

        const itemDiv = document.createElement("div");
        itemDiv.className = "cart-item";

        const img = document.createElement("img");
        img.src = item.image || "";
        img.alt = item.name || "SB CLASSIC product";

        const details = document.createElement("div");

        const name = document.createElement("h3");
        name.textContent = item.name || "Product";

        const size = document.createElement("p");
        size.textContent = "Size: " + (item.size || "N/A");

        const priceLine = document.createElement("p");
        priceLine.textContent =
          formatNaira(price) + " × " + quantity +
          " = " + formatNaira(itemTotal);

        const buttons = document.createElement("div");

        const minus = document.createElement("button");
        minus.textContent = "➖";
        minus.onclick = () => updateQuantity(item.id, -1);

        const plus = document.createElement("button");
        plus.textContent = "➕";
        plus.onclick = () => updateQuantity(item.id, 1);

        const remove = document.createElement("button");
        remove.textContent = "❌ Remove";
        remove.onclick = () => removeItem(item.id);

        buttons.append(minus, plus, remove);
        details.append(name, size, priceLine, buttons);
        itemDiv.append(img, details);
        cartItemsDiv.appendChild(itemDiv);
      });

      localStorage.setItem("cartTotal", String(total));

      cartTotalDiv.textContent = "Total: " + formatNaira(total);
      checkoutLink.style.display = "inline-block";
    }

    convertCartPricesOnce();
    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
