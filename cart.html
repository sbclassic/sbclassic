<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart – SB CLASSIC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fff;
      color: #333;
    }

    h1 {
      margin-bottom: 20px;
    }

    .currency-box {
      margin: 15px 0 20px;
      padding: 15px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .currency-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    #display-currency {
      width: 100%;
      max-width: 320px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
    }

    .exchange-note {
      margin: 8px 0 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .cart-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      padding: 10px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .cart-item img {
      width: 100px;
      height: auto;
      object-fit: contain;
    }

    .cart-item h3 {
      margin: 0;
      font-size: 16px;
    }

    .cart-item p {
      margin: 6px 0;
    }

    .cart-item-details {
      flex: 1;
      min-width: 180px;
    }

    .item-converted-price {
      color: #666;
      font-size: 13px;
    }

    button {
      margin: 5px 5px 5px 0;
      padding: 8px 12px;
      cursor: pointer;
    }

    #cart-total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #converted-total {
      margin-top: 8px;
      font-size: 16px;
      color: #444;
    }

    #checkout-link {
      display: none;
      margin-top: 20px;
      padding: 12px 20px;
      background: #191970;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    #clear-cart-btn {
      margin-top: 15px;
      padding: 10px 16px;
      background: #888;
      color: white;
      border: none;
      border-radius: 5px;
    }

    #cart-message {
      margin-top: 12px;
      color: #a00000;
    }
  </style>
</head>

<body>
  <h1>Your Cart 🛒</h1>

  <div class="currency-box">
    <label for="display-currency">Choose display currency</label>

    <select id="display-currency">
      <option value="NGN">Nigerian Naira (NGN ₦)</option>
      <option value="GHS">Ghanaian Cedi (GHS GH₵)</option>
      <option value="USD">US Dollar (USD $)</option>
      <option value="XOF">West African CFA Franc (XOF CFA)</option>
    </select>

    <p class="exchange-note">
      Prices in other currencies are estimates for display only.
      Your order total and payment amount remain in Nigerian naira.
    </p>
  </div>

  <div id="cart-items"></div>

  <div id="cart-total"></div>
  <div id="converted-total"></div>
  <div id="cart-message" role="status" aria-live="polite"></div>

  <button id="clear-cart-btn" onclick="clearCart()">
    🧹 Clear Cart
  </button>

  <br>

  <a href="checkout.html" id="checkout-link">
    Proceed to Checkout 💳
  </a>

  <script>
    const NAIRA_PRICING_VERSION = "sbclassic-naira-v2";

    /*
      Indicative display rates.
      These are NOT the business's selling-price formula.
      Update these rates when necessary.
      NGN remains the actual cart and checkout currency.
    */
    const NGN_PER_UNIT = {
      NGN: 1,
      GHS: 114.15,
      USD: 1330,
      XOF: 2.26
    };

    const CURRENCY_INFO = {
      NGN: {
        symbol: "₦",
        locale: "en-NG",
        decimals: 0
      },
      GHS: {
        symbol: "GH₵",
        locale: "en-GH",
        decimals: 2
      },
      USD: {
        symbol: "$",
        locale: "en-US",
        decimals: 2
      },
      XOF: {
        symbol: "CFA ",
        locale: "fr-SN",
        decimals: 0
      }
    };

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        return Array.isArray(cart) ? cart : [];
      } catch (error) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function getSelectedCurrency() {
      const selector = document.getElementById("display-currency");

      return selector && CURRENCY_INFO[selector.value]
        ? selector.value
        : "NGN";
    }

    function formatMoney(amount, currency) {
      const info = CURRENCY_INFO[currency] || CURRENCY_INFO.NGN;

      return info.symbol + Number(amount).toLocaleString(info.locale, {
        minimumFractionDigits: info.decimals,
        maximumFractionDigits: info.decimals
      });
    }

    function convertFromNaira(nairaAmount, currency) {
      const rate = NGN_PER_UNIT[currency] || 1;
      return Number(nairaAmount) / rate;
    }

    /*
      Pricing rule for original Ghana cedi prices:
      NGN = (original GHS price - 100) × 100

      Prices explicitly marked NGN are never converted again.
      Prices of 10,000 NGN or more without a currency marker
      are treated as already-converted naira prices.
    */
    function convertCartPricesOnce() {
      const convertedVersion =
        localStorage.getItem("sbclassicPricingVersion");

      if (convertedVersion === NAIRA_PRICING_VERSION) {
        return;
      }

      const cart = getCart();

      cart.forEach(item => {
        const price = Number(
          String(item.price ?? "").replace(/,/g, "")
        );

        if (!Number.isFinite(price) || price <= 0) {
          return;
        }

        if (item.priceCurrency === "NGN") {
          return;
        }

        if (price >= 10000) {
          item.price = price;
          item.priceCurrency = "NGN";
          return;
        }

        if (price > 100) {
          item.price = Math.round((price - 100) * 100);
          item.priceCurrency = "NGN";
        }
      });

      saveCart(cart);

      localStorage.setItem(
        "sbclassicPricingVersion",
        NAIRA_PRICING_VERSION
      );
    }

    function removeItem(productId) {
      const cart = getCart().filter(
        item => String(item.id) !== String(productId)
      );

      saveCart(cart);
      renderCart();
    }

    function updateQuantity(productId, change) {
      const cart = getCart();

      const item = cart.find(
        entry => String(entry.id) === String(productId)
      );

      if (!item) {
        return;
      }

      item.quantity = Number(item.quantity || 1) + change;

      if (item.quantity <= 0) {
        removeItem(productId);
        return;
      }

      saveCart(cart);
      renderCart();
    }

    function clearCart() {
      localStorage.removeItem("cart");
      localStorage.removeItem("cartTotal");
      localStorage.removeItem("sbclassicPricingVersion");

      const message = document.getElementById("cart-message");
      message.textContent = "";

      renderCart();
    }

    function renderCart() {
      const cartItemsDiv = document.getElementById("cart-items");
      const cartTotalDiv = document.getElementById("cart-total");
      const convertedTotalDiv = document.getElementById("converted-total");
      const checkoutLink = document.getElementById("checkout-link");
      const message = document.getElementById("cart-message");

      const cart = getCart();
      const currency = getSelectedCurrency();

      cartItemsDiv.innerHTML = "";
      message.textContent = "";
      convertedTotalDiv.textContent = "";

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
        cartTotalDiv.textContent = "";
        checkoutLink.style.display = "none";

        localStorage.setItem("cartTotal", "0");
        return;
      }

      let totalNGN = 0;

      cart.forEach(item => {
        const quantity = Math.max(1, Number(item.quantity || 1));
        const priceNGN = Number(item.price || 0);

        if (!Number.isFinite(priceNGN) || priceNGN <= 0) {
          message.textContent =
            "One or more products have an invalid price. Please remove the affected item and add it again.";
          return;
        }

        const itemTotalNGN = priceNGN * quantity;
        totalNGN += itemTotalNGN;

        const itemDiv = document.createElement("div");
        itemDiv.className = "cart-item";

        const img = document.createElement("img");
        img.src = item.image || "";
        img.alt = item.name || "SB CLASSIC product";

        const details = document.createElement("div");
        details.className = "cart-item-details";

        const name = document.createElement("h3");
        name.textContent = item.name || "Product";

        const size = document.createElement("p");
        size.textContent = "Size: " + (item.size || "N/A");

        const priceLine = document.createElement("p");
        priceLine.textContent =
          formatMoney(priceNGN, currency) +
          " × " + quantity +
          " = " + formatMoney(itemTotalNGN, currency);

        details.append(name, size, priceLine);

        if (currency !== "NGN") {
          const originalCurrencyLine = document.createElement("p");
          originalCurrencyLine.className = "item-converted-price";
          originalCurrencyLine.textContent =
            "Naira price: " + formatMoney(priceNGN, "NGN");

          details.appendChild(originalCurrencyLine);
        }

        const buttons = document.createElement("div");

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "➖";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.onclick = () => updateQuantity(item.id, -1);

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "➕";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.onclick = () => updateQuantity(item.id, 1);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "❌ Remove";
        remove.onclick = () => removeItem(item.id);

        buttons.append(minus, plus, remove);
        details.appendChild(buttons);

        itemDiv.append(img, details);
        cartItemsDiv.appendChild(itemDiv);
      });

      localStorage.setItem("cartTotal", String(totalNGN));

      cartTotalDiv.textContent =
        "Total: " + formatMoney(totalNGN, currency);

      if (currency !== "NGN") {
        const estimatedTotal = convertFromNaira(totalNGN, currency);

        convertedTotalDiv.textContent =
          "Estimated total in " + currency + ": " +
          formatMoney(estimatedTotal, currency) +
          ". Pay in NGN at checkout.";
      }

      checkoutLink.style.display = "inline-block";
    }

    document
      .getElementById("display-currency")
      .addEventListener("change", function () {
        localStorage.setItem("sbclassicDisplayCurrency", this.value);
        renderCart();
      });

    document.addEventListener("DOMContentLoaded", function () {
      const savedCurrency =
        localStorage.getItem("sbclassicDisplayCurrency");

      const selector = document.getElementById("display-currency");

      if (savedCurrency && CURRENCY_INFO[savedCurrency]) {
        selector.value = savedCurrency;
      }

      convertCartPricesOnce();
      renderCart();
    });

    // Preserve the selected display currency on this page.
    (function restoreCurrencyPreference() {
      const savedCurrency =
        localStorage.getItem("sbclassicDisplayCurrency");

      const selector = document.getElementById("display-currency");

      if (savedCurrency && CURRENCY_INFO[savedCurrency]) {
        selector.value = savedCurrency;
      }
    })();
  </script>
</body>
  </html>
