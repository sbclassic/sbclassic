name: Deploy SB Classic Payments Worker

on:
workflow_dispatch:

jobs:
deploy:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Show worker files
    run: |
      pwd
      ls -la
      ls -la worker
      cat worker/wrangler.toml

  - name: Deploy and show full error
    run: npx wrangler@3.90.0 deploy --config worker/wrangler.toml
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}